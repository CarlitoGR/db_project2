# =================================================================================================
# GitHub Actions - Faculty Schedule Generator (schedgen)
#
# Runs on GitHub-hosted ubuntu-24.04 runners (GCC 13, Clang 18, make,
# Python 3.12 preinstalled). Free plan: unlimited minutes for public repositories; private
# repositories get 2,000 minutes/month. One run uses roughly 6-8 runner minutes.
#
#   lint           ruff (Python style + lint) | committed CSV is an exact export of the .xlsx
#   build          -Werror build, static library, inspect archive -> artifact
#   test           unit + end-to-end tests (GCC and Clang) | ASan/UBSan | Valgrind
#   docs           Word / Excel / text schedules -> downloadable artifact
#   docker         build the image; question, every test and make dist inside the container
#   knowledge-base Python -> Prolog knowledge base; plunit rule tests, Python tests, Q&A demo -> artifact
#   data-quality   annotates every conflict in the class schedule as a workflow warning
# =================================================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The project lives in schedgen/. Every `run:` step starts there; action inputs (artifact paths,
# cache-dependency-path) are NOT affected by this default and stay relative to the repo root.
defaults:
  run:
    working-directory: schedgen

env:
  WARN_CFLAGS: "-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wshadow -Wstrict-prototypes -Wformat=2 -Werror"
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------------------------------- lint
  lint:
    name: lint (ruff + CSV sync)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: schedgen/requirements.txt
      - name: Install tools
        run: python -m pip install ruff==0.16.8 -r requirements.txt
      - name: Ruff lint
        run: ruff check --output-format=github scripts/ tests/
      - name: Ruff format check
        run: ruff format --check scripts/ tests/
      - name: Committed CSV matches the workbook
        run: |
          python scripts/xlsx_to_csv.py data/CTEC_Fall_2026_Schedule.xlsx "$RUNNER_TEMP/class_schedule.csv"
          diff -u data/class_schedule.csv "$RUNNER_TEMP/class_schedule.csv"

  # ------------------------------------------------------------------------------------------ build
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions
        run: gcc --version | head -1 && make --version | head -1
      - name: Build static library and program (-Werror)
        run: make clean && make CFLAGS="$WARN_CFLAGS"
      - name: Inspect static library
        run: make inspect
      - run: ./build/schedgen -V
      - uses: actions/upload-artifact@v7
        with:
          name: schedgen-build
          path: |
            schedgen/build/schedgen
            schedgen/build/libschedule.a
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------- test
  test-unit:
    name: test (${{ matrix.cc }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Unit + end-to-end tests
        run: make CC=${{ matrix.cc }} CFLAGS="$WARN_CFLAGS" test
      - name: Keep test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.cc }}
          path: schedgen/build/test_out/
          retention-days: 3

  test-sanitizers:
    name: test (ASan + UBSan)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      SAN_CFLAGS: "-std=c11 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v7
      # Ubuntu 24.04 runners use high mmap ASLR entropy, which breaks AddressSanitizer start-up.
      - name: Make ASLR compatible with ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Tests under sanitizers
        run: make BUILD=build-asan CFLAGS="$SAN_CFLAGS" test
      - name: Real CTEC data under sanitizers (exit 3 = conflicts found, expected)
        run: |
          status=0
          ./build-asan/schedgen -q -o build-asan/run data/class_schedule.csv data/faculty.csv || status=$?
          echo "schedgen exit status $status"
          test "$status" -eq 0 -o "$status" -eq 3

  test-valgrind:
    name: test (Valgrind)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends valgrind
      - run: make build/schedgen build/test_schedule
      - name: Unit tests under Valgrind
        run: valgrind --error-exitcode=9 --leak-check=full --errors-for-leak-kinds=definite,indirect ./build/test_schedule build
      - name: Real CTEC data under Valgrind (9 = memory error)
        run: |
          status=0
          valgrind --error-exitcode=9 --leak-check=full --errors-for-leak-kinds=definite,indirect \
            ./build/schedgen -q -o build/vg data/class_schedule.csv data/faculty.csv || status=$?
          echo "exit status $status"
          test "$status" -eq 0 -o "$status" -eq 3

  # ------------------------------------------------------------------------------------------- docs
  docs:
    needs: [build, test-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: schedgen/requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: schedgen-build
          path: schedgen/build
      # Artifacts are zipped, which drops the executable bit.
      - run: chmod +x build/schedgen
      - name: Generate schedules (uses the binary from the build job, no recompilation)
        run: make -o build/schedgen -o build/libschedule.a docs
      - name: Job summary
        run: |
          {
            echo "## Faculty schedules generated"
            echo '```'
            head -n 8 output/schedule.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: faculty-schedules
          path: |
            schedgen/output/
            !schedgen/output/.*.stamp
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------------- knowledge base
  # Python turns the C program's output into Prolog facts; SWI-Prolog answers questions through pyswip.
  knowledge-base:
    needs: [build, test-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SWI-Prolog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends swi-prolog-nox
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: schedgen/requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: schedgen-build
          path: schedgen/build
      - run: chmod +x build/schedgen
      - name: Rule tests (plunit), Python tests, end-to-end question (CS department fixture)
        run: make -o build/schedgen -o build/libschedule.a test-kb
      - name: Knowledge base and Q&A demo on the CTEC schedule
        run: make -o build/schedgen -o build/libschedule.a demo
      - name: Job summary
        run: |
          {
            echo "## Question answering (Prolog)"
            echo '```'
            sed -n '1,40p' build/kb_test/qa_demo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: knowledge-base
          path: |
            schedgen/output/knowledge_base.pl
            schedgen/output/qa_demo.txt
            schedgen/build/kb_test/knowledge_base.pl
            schedgen/build/kb_test/qa_demo.txt
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------------------------------- docker
  # The image must build from a clean checkout and pass the same tests inside the container.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t schedgen .
      - name: Answer a question
        run: |
          docker run --rm schedgen "What classes does Dr Yang teach?" | tee "$RUNNER_TEMP/answer.txt"
          grep -q "COSC 631" "$RUNNER_TEMP/answer.txt"
      - name: All tests inside the container
        run: docker run --rm schedgen make test test-kb
      - name: Submission package built inside the container
        run: |
          docker run --name dist schedgen make dist
          docker cp dist:/app/dist/Carlson_Cox_COSC631_Midterm.zip "$RUNNER_TEMP/"
          docker rm dist
          python3 -m zipfile -l "$RUNNER_TEMP/Carlson_Cox_COSC631_Midterm.zip" | grep -q "build/libschedule.a"

  # ----------------------------------------------------------------------------------- data quality
  # The department's class schedule currently contains real conflicts. They are a finding about the
  # data, not a build failure: each one is raised as a warning annotation and listed in the summary.
  data-quality:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schedgen-build
          path: schedgen/build
      - run: chmod +x build/schedgen
      - name: Check class schedule for conflicts
        run: |
          status=0
          ./build/schedgen -q -o "$RUNNER_TEMP/dq" data/class_schedule.csv data/faculty.csv || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::schedgen failed with exit status $status"
            exit "$status"
          fi
          {
            echo "## Class schedule data issues"
            echo
            echo "| Severity | Issue |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            level="${line%%: *}"
            message="${line#*: }"
            case "$level" in
              ERROR|WARNING)
                echo "::warning title=Schedule ${level}::${message}"
                echo "| ${level} | ${message//|/\\|} |" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done < "$RUNNER_TEMP/dq/diagnostics.txt"
          if [ "$status" -eq 0 ]; then
            echo "No conflicts found." >> "$GITHUB_STEP_SUMMARY"
          fi
